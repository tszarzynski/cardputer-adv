# The crate's pure logic (the modules with no esp-hal in them), compiled
# for the host so its tests run with `cargo test`: `just test`. Not
# published; the crate itself builds only for the ESP32-S3.
[package]
name = "cardputer-adv-host-tests"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace, apart from the crate's.
[workspace]

[lib]
path = "lib.rs"

# The versions the crate uses.
[dependencies]
bytemuck = "1.24"
embedded-graphics-core = "0.4"

# The keyboard driver the keyboard's layout came from, to check it against.
[dev-dependencies]
cardputer-adv-keyboard = "0.2.6"
embedded-hal = "1.0"

# The crate's own features that its pure modules mention; off here.
[features]
defmt = []

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[lints.rust]
unsafe_code = "forbid"
