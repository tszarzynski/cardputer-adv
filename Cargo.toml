[package]
name = "cardputer-adv"
version = "0.1.0"
description = "Board support for the M5Stack Cardputer ADV (ESP32-S3) on esp-hal: display, keyboard, motion sensor, speaker, microphone, RGB LED, IR, microSD, backlight and battery"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
keywords = ["cardputer", "m5stack", "esp32s3", "esp-hal", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]
readme = "README.md"
repository = "https://github.com/tszarzynski/cardputer-adv"
# docs.rs can't build for Xtensa: CI publishes the API docs to GitHub Pages.
documentation = "https://tszarzynski.github.io/cardputer-adv/"
# The crate itself; the repo's tooling (Justfile, toolchain, CLAUDE.md) stays out.
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-APACHE", "LICENSE-MIT"]

# The lints both apps use.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dependencies]
bmi2 = "0.1.2"
bytemuck = "1.24"
critical-section = "1.2"
defmt = { version = "1.1", optional = true }
cardputer-adv-keyboard = "0.2.6"
embassy-futures = "0.1.2"
embassy-time = "0.5.1"
embedded-graphics-core = "0.4"
embedded-hal = "1.0"
embedded-hal-bus = "0.3"
embedded-sdmmc = { version = "0.10", default-features = false, optional = true }
esp-hal = { version = "~1.2.2", features = ["esp32s3", "unstable"] }
mipidsi = "0.10"
static_cell = "2.1.1"

[features]
# The microSD card, through embedded-sdmmc (`sd_card`).
sd-card = ["dep:embedded-sdmmc"]
# `defmt::Format` for `Error`, for apps that log with defmt.
defmt = ["dep:defmt"]

# For the hardware test (`examples/hardware.rs`), at the versions the apps use.
[dev-dependencies]
embassy-executor = "0.10.0"
embassy-sync = "0.8"
embedded-graphics = "0.8.2"
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp32s3", "log-04"] }
log = "0.4.27"

[[example]]
name = "hardware"
required-features = ["sd-card"]

[profile.release]
debug = 2
