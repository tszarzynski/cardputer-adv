# The crate builds only for the Cardputer's ESP32-S3 (its pure logic is also
# tested on the host: host-tests/ has its own config).
[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --chip esp32s3"
# For linking the example (a library doesn't link).
rustflags = [
  "-C", "link-arg=-nostartfiles",
  "-C", "link-arg=-Tlinkall.x",
  # esp-hal's memory layout has one: expected, not a fault.
  "-C", "link-arg=-Wl,--no-warn-rwx-segments",
]

[unstable]
build-std = ["core"]

# The example's log level.
[env]
ESP_LOG = "info"
